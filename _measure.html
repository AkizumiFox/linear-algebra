<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mathjax.css">
<style>#stage{width:39rem;font-size:20px}</style></head>
<body><div id="stage"></div><pre id="out"></pre>
<script>
(async () => {
  const nav = await (await fetch('navigation.json')).json();
  const pages = [];
  for (const c of nav.chapters) for (const s of c.sections) pages.push(s.path);
  const stage = document.getElementById('stage'), out = [];
  for (const path of pages) {
    const html = await (await fetch(path)).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const content = doc.querySelector('.content');
    if (!content) continue;
    stage.innerHTML = '';
    stage.appendChild(content);
    const limit = stage.clientWidth;
    for (const box of stage.querySelectorAll('mjx-container[display="true"]')) {
      const w = box.getBoundingClientRect().width;
      if (w > limit) {
        const tex = (box.querySelector('mjx-assistive-mml math')?.textContent || '').slice(0, 60);
        out.push(`${Math.round(w / limit * 100)}%\t${path}\t${tex.replace(/\s+/g, ' ')}`);
      }
    }
  }
  document.getElementById('out').textContent = out.join('\n') || 'none';
  document.title = 'done ' + out.length;
})();
</script></body></html>
