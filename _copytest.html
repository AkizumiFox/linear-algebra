<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="ch01-vector-spaces/02-subspaces.html" width="1000" height="600"></iframe>
<pre id="out">running</pre>
<script>
document.getElementById('f').addEventListener('load', () => {
  setTimeout(() => {
    const d = document.getElementById('f').contentDocument;
    const w = document.getElementById('f').contentWindow;
    const para = [...d.querySelectorAll('.content p')].find(p => p.querySelector('mjx-container[data-tex]'));
    const range = d.createRange();
    range.selectNodeContents(para);
    const sel = w.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    const dt = new w.DataTransfer();
    const ev = new w.ClipboardEvent('copy', { clipboardData: dt, bubbles: true, cancelable: true });
    d.dispatchEvent(ev);
    document.getElementById('out').textContent = dt.getData('text/plain').slice(0, 400) || '(clipboard empty)';
  }, 2500);
});
</script></body></html>
