<!DOCTYPE html><html><body><iframe id="f" src="ch06-determinants/01-area-and-volume.html" width="1000" height="800"></iframe><pre id="out">…</pre>
<script>
document.getElementById('f').addEventListener('load', () => setTimeout(() => {
  const d = document.getElementById('f').contentDocument;
  const w = d.querySelector('.widget');
  const mount = d.querySelector('.widget-mount');
  const out = [];
  out.push('widget found: ' + !!w);
  if (w) { const r = w.getBoundingClientRect(); out.push(`top=${Math.round(r.top + d.documentElement.scrollTop)} h=${Math.round(r.height)}`); }
  if (mount) out.push('mount children: ' + mount.children.length + ' | ' + [...mount.children].map(c => c.tagName + '.' + c.className).join(', '));
  out.push('fallback shown: ' + !!d.querySelector('.widget-fallback'));
  out.push('svg count: ' + (mount ? mount.querySelectorAll('svg').length : 0));
  document.getElementById('out').textContent = out.join('\n');
}, 4000));
</script></body></html>
